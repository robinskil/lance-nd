[package]
name = "lance-nd"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "N-dimensional datasets stored in Lance, one dataset or chunk per row"
license = "Apache-2.0"
documentation = "https://docs.rs/lance-nd"

[workspace]
members = [".", "python"]
exclude = ["fuzz"]

[features]
# Object stores. The local file system needs no feature.
aws = ["lance/aws"]
gcp = ["lance/gcp"]
azure = ["lance/azure"]

[dependencies]
arrow = { version = "58", default-features = false }
chrono = { version = "0.4", default-features = false }
futures = "0.3"
lance = { version = "11", default-features = false }
lance-core = "11"
lance-file = "11"
nd-arrow-array = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
object_store = "0.13"
proptest = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
