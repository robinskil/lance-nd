[package]
name = "lance-nd"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "N-dimensional datasets stored in Lance, one dataset or chunk per row"
license = "Apache-2.0"

[workspace]
members = [".", "python"]

[dependencies]
arrow = { version = "58", default-features = false }
chrono = { version = "0.4", default-features = false }
futures = "0.3"
lance = { version = "11", default-features = false }
lance-core = "11"
lance-file = "11"
nd-arrow-array = { git = "https://github.com/robinskil/nd-arrow-array" }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
