[package]
name = "lance-nd-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Python bindings for lance-nd"
license = "Apache-2.0"
publish = false

[lib]
name = "_lance_nd"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58", default-features = false, features = ["pyarrow"] }
futures = "0.3"
lance-nd = { path = "..", features = ["aws", "azure", "gcp"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
lance = { version = "11", default-features = false }
lance-datafusion = "11"
nd-arrow-array = "0.5"
pyo3 = { version = "0.28", features = ["abi3-py310"] }
