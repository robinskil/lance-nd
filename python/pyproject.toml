[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "lance_nd"
version = "0.1.0"
description = "Store xarray datasets as N-dimensional Arrow arrays in Lance"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "h5netcdf>=1.1",
    "nd-arrow-array[arrow,xarray]>=0.5,<0.6",
    "netCDF4>=1.6",
    "numpy>=1.24",
    "pyarrow>=14",
    "xarray>=2023.1",
]
keywords = ["arrow", "lance", "xarray", "netcdf", "n-dimensional"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/robinskil/lance-nd"
Repository = "https://github.com/robinskil/lance-nd"
Issues = "https://github.com/robinskil/lance-nd/issues"

[project.scripts]
lance-nd = "lance_nd.cli:main"

[project.optional-dependencies]
dev = ["dask", "mypy", "pandas-stubs", "pytest"]

[tool.maturin]
module-name = "lance_nd._lance_nd"
python-source = "."
features = ["pyo3/extension-module"]

[tool.mypy]
files = ["lance_nd"]
strict = true

[[tool.mypy.overrides]]
# pyarrow has no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
